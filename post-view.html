<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{background:#f5f5f5;min-height:100vh;padding:20px;}

.back-btn{margin-bottom:20px;background:white;border:none;padding:10px 16px;border-radius:8px;cursor:pointer;font-weight:500;box-shadow:0 3px 10px rgba(0,0,0,0.05);transition:0.2s;display:flex;align-items:center;gap:6px;}
.back-btn:hover{transform:translateY(-1px);box-shadow:0 5px 15px rgba(0,0,0,0.1);}

.container{max-width:600px;margin:0 auto;background:white;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,0.08);overflow:hidden;}

.post-header{display:flex;align-items:center;gap:12px;padding:20px;border-bottom:1px solid #f0f0f0;}
.post-header img{width:45px;height:45px;border-radius:50%;cursor:pointer;transition:0.2s;object-fit:cover;}
.post-header img:hover{transform:scale(1.05);}
.post-header strong{font-size:16px;cursor:pointer;}
.post-header strong:hover{color:#ff6a00;}

.post-content{padding:20px;font-size:16px;line-height:1.6;word-wrap:break-word;}

/* Media Styles - Both Image and Video */
.post-media{width:100%;max-height:500px;object-fit:cover;display:block;background:#000;}
.post-image{cursor:pointer;}
.post-video{cursor:pointer;outline:none;}

.post-actions{padding:0 20px 20px;display:flex;gap:35px;border-bottom:1px solid #f0f0f0;padding-bottom:20px;margin-top:15px;}
.action-item{cursor:pointer;font-size:16px;transition:0.2s;display:flex;align-items:center;gap:6px;color:#555;}
.action-item:hover{color:#ff6a00;}
.like-btn.liked{color:#ff4444;}
.like-btn.liked i{font-weight:900;}

.comments-section{padding:20px;}
.comments-title{font-weight:600;margin-bottom:15px;font-size:15px;color:#444;}

.comment-list{display:flex;flex-direction:column;gap:15px;margin-bottom:20px;}
.comment{background:#f8f8f8;padding:15px;border-radius:10px;transition:0.2s;}
.comment:hover{background:#f0f0f0;}
.comment-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.comment-header strong{font-size:14px;color:#ff6a00;}
.comment-header small{font-size:11px;color:#888;}
.comment-text{font-size:14px;color:#333;line-height:1.5;margin-bottom:10px;word-wrap:break-word;}
.comment-actions{display:flex;gap:15px;font-size:13px;color:#666;}
.comment-actions span{cursor:pointer;display:flex;align-items:center;gap:4px;}
.comment-actions span:hover{color:#ff6a00;}

.reply-list{margin-top:12px;margin-left:30px;display:flex;flex-direction:column;gap:12px;}
.reply{background:#ffffff;padding:12px;border-radius:8px;border-left:2px solid #ff6a00;}
.reply .comment-header strong{font-size:13px;}
.reply .comment-text{font-size:13px;}

.reply-input-wrapper{margin-top:12px;display:flex;gap:8px;align-items:flex-end;}
.reply-input{flex:1;padding:10px 12px;border:1px solid #ddd;border-radius:8px;resize:none;font-size:13px;outline:none;min-height:40px;font-family:'Poppins',sans-serif;}
.reply-input:focus{border-color:#ff6a00;}
.reply-btn-submit{background:#ff6a00;color:white;border:none;padding:10px 16px;border-radius:8px;font-weight:500;cursor:pointer;transition:0.2s;font-size:13px;white-space:nowrap;}
.reply-btn-submit:hover{background:#e55d00;transform:translateY(-1px);}
.reply-btn-submit:disabled{opacity:0.5;cursor:not-allowed;transform:none;}

.comment-input-wrapper{display:flex;gap:10px;align-items:flex-end;}
.comment-input{flex:1;padding:12px 15px;border:1px solid #ddd;border-radius:10px;resize:none;font-size:14px;outline:none;transition:0.2s;min-height:48px;font-family:'Poppins',sans-serif;}
.comment-input:focus{border-color:#ff6a00;}
.comment-btn{background:#ff6a00;color:white;border:none;padding:12px 20px;border-radius:10px;font-weight:500;cursor:pointer;transition:0.2s;white-space:nowrap;}
.comment-btn:hover{background:#e55d00;transform:translateY(-1px);}
.comment-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;}

.spinner{border:3px solid rgba(255,255,255,0.3);border-top:3px solid white;border-radius:50%;width:18px;height:18px;animation:spin 1s linear infinite;}
@keyframes spin{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}

.loading{text-align:center;padding:50px;color:#888;}

/* Media Modal for Image Viewing */
.media-modal{position:fixed;inset:0;background:rgba(0,0,0,0.95);display:none;align-items:center;justify-content:center;z-index:3000;cursor:zoom-out;padding:20px;}
.media-modal.active{display:flex;}
.media-modal img{max-width:95%;max-height:95vh;border-radius:12px;object-fit:contain;}
.close-modal{position:absolute;top:20px;right:25px;color:white;font-size:35px;cursor:pointer;background:none;border:none;}

/* Verified Badge */
.verified-badge{background:#1DA1F2;color:white;width:16px;height:16px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;margin-left:5px;}
.verified-badge-post{background:#1DA1F2;color:white;width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;margin-left:5px;vertical-align:middle;}

@media(max-width:600px){
    body{padding:10px;}
    .post-header, .post-content, .post-actions, .comments-section{padding:15px;}
    .post-actions{gap:25px;}
    .reply-list{margin-left:20px;}
    .post-media{max-height:350px;}
}

/* Save action & toast */
#save-action{margin-left:auto;font-weight:500;user-select:none;}
#save-action:active{transform:scale(0.94);}
#save-action i{transition:0.2s;}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(80px);background:#1e2937;color:white;padding:12px 26px;border-radius:30px;font-size:14px;font-weight:500;z-index:4000;opacity:0;transition:all 0.35s ease;box-shadow:0 8px 30px rgba(0,0,0,0.3);max-width:90%;text-align:center;pointer-events:none;}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}

/* Save progress overlay (used while a video is being rendered) */
.sv-overlay{position:fixed;inset:0;z-index:3500;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.78);backdrop-filter:blur(8px);color:white;padding:24px;}
.sv-overlay.active{display:flex;}
.sv-card{width:min(340px,92vw);background:#161618;border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:28px 24px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.5);}
.sv-spinner{width:64px;height:64px;border-radius:50%;background:rgba(255,106,0,0.15);color:#ff6a00;display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 16px;animation:svPulse 1.2s ease-in-out infinite;}
@keyframes svPulse{0%,100%{opacity:0.6;transform:scale(0.95);}50%{opacity:1;transform:scale(1.05);}}
.sv-title{font-weight:700;font-size:16px;margin-bottom:8px;}
.sv-sub{font-size:13px;color:#9aa3af;line-height:1.5;margin-bottom:14px;min-height:18px;}
.sv-bar{height:6px;background:rgba(255,255,255,0.1);border-radius:4px;overflow:hidden;margin-bottom:16px;}
.sv-bar-fill{height:100%;width:0;background:linear-gradient(90deg,#ff6a00,#ff8a00);transition:width 0.3s;}
.sv-cancel{background:rgba(255,255,255,0.08);color:#fff;border:1px solid rgba(255,255,255,0.15);padding:9px 22px;border-radius:24px;cursor:pointer;font-size:13px;font-family:'Poppins',sans-serif;transition:0.2s;}
.sv-cancel:hover{background:rgba(239,68,68,0.6);}
</style>

<script type="module">

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const urlParams = new URLSearchParams(window.location.search);
const postId = urlParams.get('postId');

const posterPic = document.getElementById("poster-pic");
const posterName = document.getElementById("poster-name");
const postText = document.getElementById("post-text");
const mediaContainer = document.getElementById("media-container");
const likeBtn = document.getElementById("like-btn");
const likeCountSpan = likeBtn.querySelector('span');
const viewCountSpan = document.getElementById('view-count').querySelector('span');
const commentList = document.getElementById("comment-list");
const commentInput = document.getElementById("comment-input");
const commentBtn = document.getElementById("comment-btn");
const commentCount = document.getElementById("comment-count");
const verifiedBadge = document.getElementById("verified-badge");
const saveActionEl = document.getElementById("save-action");
let currentMedia = null;
let isSaving = false;
saveActionEl.onclick = () => saveCurrentMedia();

let currentUser=null;
let currentUsername = "User";
let isLiked = false;

onAuthStateChanged(auth, async user=>{
  if(!user) window.location.href="login.html";
  currentUser=user;

  // Get current user's username
  const userDoc = await getDoc(doc(db, "users", user.uid));
  if(userDoc.exists()){
    currentUsername = userDoc.data().username || user.email.split('@')[0];
  }

  loadPost();
  loadComments();
});

// Load post data with real-time updates
function loadPost(){
  const postRef = doc(db,"posts",postId);
  
  // Track views (only increment once per user)
  getDoc(postRef).then(async postSnap => {
    if(postSnap.exists()){
      const post = postSnap.data();
      if(!post.viewedBy || !post.viewedBy.includes(currentUser.uid)){
        await updateDoc(postRef, {
          views: increment(1),
          viewedBy: arrayUnion(currentUser.uid)
        });
      }
    }
  });

  // Real-time post updates
  onSnapshot(postRef, async postSnap => {
    if(!postSnap.exists()){ alert("Post not found"); return; }
    const post = postSnap.data();

    posterName.innerText = post.username || "Anonymous";
    posterPic.src = post.userAvatar || `https://i.pravatar.cc/150?u=${post.userId}`;
    postText.innerText = post.content || '';
    
    // Handle media - check for video first, then image
    mediaContainer.innerHTML = ''; // Clear previous media
    
    if(post.videoUrl){
      // Video content
      const video = document.createElement('video');
      video.src = post.videoUrl;
      video.className = 'post-media post-video';
      video.controls = true;
      video.preload = 'metadata';
      video.playsInline = true;
      video.setAttribute('playsinline', '');
      video.setAttribute('webkit-playsinline', '');
      video.style.width = '100%';
      video.style.maxHeight = '500px';
      mediaContainer.appendChild(video);
    } else if(post.imageBase64){
      // Image content
      const img = document.createElement('img');
      img.src = post.imageBase64;
      img.className = 'post-media post-image';
      img.alt = 'Post image';
      img.onclick = () => viewImage(post.imageBase64);
      mediaContainer.appendChild(img);
    }

    // Media available? Reveal the Save action (hidden for text-only posts).
    if(post.videoUrl || post.imageBase64){
      currentMedia = {
        type: post.videoUrl ? 'video' : 'image',
        id: postId,
        videoUrl: post.videoUrl || null,
        imageRaw: post.imageBase64 || null
      };
      saveActionEl.style.display = 'inline-flex';
    } else {
      currentMedia = null;
      saveActionEl.style.display = 'none';
    }

    // Check verification status
    try {
      const userDoc = await getDoc(doc(db, "users", post.userId));
      if(userDoc.exists() && (userDoc.data().isVerified || userDoc.data().verified)){
        verifiedBadge.style.display = 'inline-flex';
      }
    } catch(e) {}

    posterPic.onclick = ()=>{ window.location.href=`profile.html?uid=${post.userId}`; }
    posterName.onclick = ()=>{ window.location.href=`profile.html?uid=${post.userId}`; }

    // Update view count
    viewCountSpan.innerText = post.views || 0;

    // Update like state and count
    isLiked = post.likedBy?.includes(currentUser.uid) || false;
    likeCountSpan.innerText = post.likes || 0;
    if(isLiked) likeBtn.classList.add('liked');
    else likeBtn.classList.remove('liked');
  });
}

// Like/Unlike functionality
likeBtn.onclick = async () => {
  const postRef = doc(db,"posts",postId);
  if(isLiked){
    // Unlike
    await updateDoc(postRef, {
      likes: increment(-1),
      likedBy: arrayRemove(currentUser.uid)
    });
  } else {
    // Like
    await updateDoc(postRef, {
      likes: increment(1),
      likedBy: arrayUnion(currentUser.uid)
    });
  }
};

// Load comments with replies
function loadComments(){
  const commentsRef = collection(db,"posts",postId,"comments");
  const q = query(commentsRef, orderBy("timestamp", "asc"));

  onSnapshot(q, snap => {
    commentCount.innerText = snap.size;
    commentList.innerHTML="";

    if(snap.empty){
      commentList.innerHTML = `<div style="text-align:center;color:#888;padding:20px;">No comments yet. Be the first!</div>`;
      return;
    }

    // Separate top-level comments and replies
    const comments = [];
    const replies = new Map();

    snap.forEach(doc => {
      const data = doc.data();
      data.id = doc.id;
      if(data.parentCommentId){
        if(!replies.has(data.parentCommentId)) replies.set(data.parentCommentId, []);
        replies.get(data.parentCommentId).push(data);
      } else {
        comments.push(data);
      }
    });

    // Render top-level comments and their replies
    comments.forEach(comment => {
      renderComment(comment, replies.get(comment.id) || []);
    });
  });
}

// Render a single comment with its replies
function renderComment(comment, replies=[]){
  const div = document.createElement("div");
  div.className = "comment";
  div.dataset.commentId = comment.id;

  const time = comment.timestamp ? timeAgo(comment.timestamp.toDate()) : "Just now";

  div.innerHTML = `
    <div class="comment-header">
      <small>${time}</small>
    </div>
    <div class="comment-text">${escapeHtml(comment.text)}</div>
    <div class="comment-actions">
      <span class="reply-btn" data-comment-id="${comment.id}">
        <i class="fa-solid fa-reply"></i> Reply
      </span>
    </div>
  `;

  // Add reply input container
  const replyInputContainer = document.createElement("div");
  replyInputContainer.className = "reply-input-wrapper";
  replyInputContainer.style.display = "none";
  replyInputContainer.innerHTML = `
    <textarea class="reply-input" placeholder="Write a reply..." rows="1"></textarea>
    <button class="reply-btn-submit" data-comment-id="${comment.id}">Post</button>
  `;
  div.appendChild(replyInputContainer);

  // Add reply list
  const replyList = document.createElement("div");
  replyList.className = "reply-list";
  div.appendChild(replyList);

  // Render replies
  replies.forEach(reply => {
    const replyDiv = document.createElement("div");
    replyDiv.className = "reply";
    replyDiv.innerHTML = `
      <div class="comment-header">
        <small>${timeAgo(reply.timestamp.toDate())}</small>
      </div>
      <div class="comment-text">${escapeHtml(reply.text)}</div>
    `;
    replyList.appendChild(replyDiv);
  });

  commentList.appendChild(div);

  // Add reply button event listeners
  div.querySelector(".reply-btn").addEventListener("click", (e) => {
    const container = e.target.closest(".comment").querySelector(".reply-input-wrapper");
    container.style.display = container.style.display === "none" ? "flex" : "none";
    if(container.style.display === "flex"){
      container.querySelector(".reply-input").focus();
    }
  });

  // Add reply submit listener
  div.querySelector(".reply-btn-submit").addEventListener("click", async (e) => {
    const commentId = e.target.dataset.commentId;
    const input = e.target.previousElementSibling;
    const text = input.value.trim();
    if(!text) return;

    e.target.disabled = true;
    e.target.innerHTML = `<div class="spinner" style="width:14px;height:14px;"></div>`;

    await addDoc(collection(db,"posts",postId,"comments"),{
      userId: currentUser.uid,
      username: currentUsername,
      text: text,
      parentCommentId: commentId,
      timestamp: serverTimestamp()
    });

    input.value="";
    e.target.disabled = false;
    e.target.innerHTML = "Post";
    e.target.closest(".reply-input-wrapper").style.display = "none";
  });
}

// Enable/disable comment button
commentInput.addEventListener("input", () => {
  commentBtn.disabled = commentInput.value.trim().length === 0;
});

// Add comment
commentBtn.onclick=async()=>{
  const text = commentInput.value.trim();
  if(!text) return;

  commentBtn.disabled = true;
  commentBtn.innerHTML = `<div class="spinner"></div>`;

  await addDoc(collection(db,"posts",postId,"comments"),{

  });

  commentInput.value="";
  commentBtn.innerHTML = "Post";
  commentBtn.disabled = true;
};

// Escape HTML to prevent XSS
function escapeHtml(text) {
  if (!text) return '';
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// View image in modal
window.viewImage = (src) => {
  document.getElementById("modal-image").src = src;
  document.getElementById("media-modal").classList.add("active");
  document.body.style.overflow = 'hidden';
};

window.closeMediaModal = () => {
  document.getElementById("media-modal").classList.remove("active");

};

// Close modal on escape key
document.addEventListener('keydown', (e) => {

// ==================== SAVE-TO-DEVICE ====================
// Saves produce a normal-looking download and the UI never announces the
// mark. Photos get the site mark baked in quietly; videos are re-encoded with

const SITE_LOGO_URL = "https://res.cloudinary.com/dq7fpxfbc/image/upload/v1772726030/logo2_drw2fc.jpg";
const APP_NAME = "CashClique";
// Cloud Function that re-serves Storage media with permissive CORS so it can be

// elsewhere (see functions/index.js -> exports.getMedia).
const MEDIA_PROXY_BASE = "https://us-central1-cashclique-31718.cloudfunctions.net/getMedia?url=";
let logoImage = null;
let logoPromise = null;

function imageDataSrc(raw){
  if(!raw) return '';
  if(raw.startsWith('data:') || raw.startsWith('http')) return raw;
  return `data:image/jpeg;base64,${raw}`;
}

let toastTimer = null;
function showToast(message){
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('show');
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2600);
}

function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 2500);
}

function downloadViaAnchor(href, filename){
  const a = document.createElement('a');
  a.href = href;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => a.remove(), 2500);
}

function loadLogo(){
  if(logoImage) return Promise.resolve(logoImage);
  if(logoPromise) return logoPromise;
  logoPromise = new Promise((resolve) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => { logoImage = removeLogoWhiteBackground(img); resolve(logoImage); };
    img.onerror = () => { logoImage = null; resolve(null); };
    img.src = SITE_LOGO_URL + (SITE_LOGO_URL.includes('?') ? '&' : '?') + 't=' + Date.now();
    setTimeout(() => resolve(logoImage), 6000);
  });
  return logoPromise;
}

// The site logo is a JPG on a white square - strip the white background with a
// soft ramp so the mark blends over photos instead of showing as a white box.
function removeLogoWhiteBackground(img){
  try {
    const w = img.naturalWidth || img.width;
    const h = img.naturalHeight || img.height;
    if(!w || !h) return img;
    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    const ctx = c.getContext('2d');
    if(!ctx) return img;
    ctx.drawImage(img, 0, 0, w, h);
    const data = ctx.getImageData(0, 0, w, h);
    const px = data.data;
    let kept = 0;
    for(let i = 0; i < px.length; i += 4){
      const whiteness = Math.min(px[i], px[i+1], px[i+2]);
      let alpha;
      if(whiteness <= 200) alpha = 255;
      else if(whiteness >= 252) alpha = 0;
      else alpha = Math.round(((252 - whiteness) / 52) * 255);
      if(alpha < px[i+3]) px[i+3] = alpha;
      if(px[i+3] > 0) kept++;
    }
    ctx.putImageData(data, 0, 0);
    if(!kept) return img;
    return c;
  } catch(err){
    return img;
  }
}

// Rounded-rectangle path helper (avoids depending on ctx.roundRect support).
function roundRectPath(ctx, x, y, w, h, r){
  const rr = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}

// Cached diagonal tiled watermark. Built once per canvas size, then blitted onto
// every photo / video frame so it stays cheap to apply.
let _wmLayers = {};
async function getWatermarkLayer(w, h){
  const key = w + 'x' + h;
  if(_wmLayers[key]) return _wmLayers[key];
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.save();
  ctx.translate(w/2, h/2);
  ctx.rotate(-Math.PI / 7);
  const fs = Math.max(16, Math.round(w * 0.03));
  ctx.font = `700 ${fs}px Poppins, Arial, sans-serif`;
  ctx.fillStyle = 'rgba(255,255,255,0.085)';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(0,0,0,0.35)';
  ctx.shadowBlur = 2;
  const text = APP_NAME + '  •  ' + APP_NAME;
  const tw = ctx.measureText(text).width;
  const stepX = Math.ceil(tw * 1.05);
  const stepY = Math.max(Math.round(h * 0.16), fs * 4);
  const reach = Math.ceil(Math.max(w, h) * 1.5);
  let row = 0;
  for(let y = -reach; y <= reach; y += stepY, row++){
    const offset = (row % 2) ? stepX / 2 : 0;
    for(let x = -reach; x <= reach; x += stepX){
      ctx.fillText(text, x + offset, y);
    }
  }
  ctx.restore();
  _wmLayers[key] = c;
  return c;
}

// Designed corner badge: a translucent dark pill holding the logo + brand name.
async function drawBrandBadge(ctx, w, h){
  const logo = await loadLogo();
  const pad = Math.max(12, Math.round(w * 0.028));
  const fs = Math.max(15, Math.round(w * 0.03));
  ctx.save();
  ctx.font = `700 ${fs}px Poppins, Arial, sans-serif`;
  const name = APP_NAME;
  const textW = ctx.measureText(name).width;
  const hasLogo = !!(logo && logo.width > 0);
  const logoSize = Math.min(fs * 1.4, 52);
  const gap = hasLogo ? Math.round(fs * 0.45) : 0;
  const innerW = (hasLogo ? logoSize + gap : 0) + textW;
  const badgeW = innerW + pad * 2;
  const badgeH = Math.max(logoSize, fs) + pad * 2;
  const bx = w - badgeW - pad;
  const by = h - badgeH - pad;
  // pill background with a soft shadow
  ctx.shadowColor = 'rgba(0,0,0,0.55)';
  ctx.shadowBlur = 16;
  ctx.shadowOffsetY = 2;
  ctx.fillStyle = 'rgba(15,23,42,0.58)';
  roundRectPath(ctx, bx, by, badgeW, badgeH, badgeH/2);
  ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.shadowBlur = 0;
  ctx.shadowOffsetY = 0;
  if(hasLogo){
    const ly = by + (badgeH - logoSize)/2;
    ctx.drawImage(logo, bx + pad, ly, logoSize, logoSize);
    ctx.fillStyle = '#ffffff';
    ctx.textBaseline = 'middle';
    ctx.fillText(name, bx + pad + logoSize + gap, by + badgeH/2 + 1);
  } else {
    ctx.fillStyle = '#ffffff';
    ctx.textBaseline = 'middle';
    ctx.fillText(name, bx + pad, by + badgeH/2 + 1);
  }
  ctx.restore();
}

// Full site mark: a subtle tiled brand layer + the designed corner badge.
async function drawSiteLogo(ctx, w, h){
  try {
    const layer = await getWatermarkLayer(w, h);
    ctx.drawImage(layer, 0, 0);
  } catch(e){}
  try { await drawBrandBadge(ctx, w, h); } catch(e){}
}

// Fetch a remote media file and hand back a same-origin blob: URL. Tries the
// direct URL first (works once Storage CORS is configured) and falls back to the
// media-proxy Cloud Function (works with no bucket CORS setup at all).
async function fetchVideoObjectUrl(url){
  const candidates = [url, MEDIA_PROXY_BASE ? MEDIA_PROXY_BASE + encodeURIComponent(url) : null].filter(Boolean);
  for(const u of candidates){
    try {
      const resp = await fetch(u);
      if(!resp.ok) continue;
      const blob = await resp.blob();
      if(blob && blob.size > 0) return URL.createObjectURL(blob);
    } catch(e){ /* try next candidate */ }
  }
  return null;
}

async function saveCurrentMedia(){
  if(!currentMedia || isSaving) return;
  isSaving = true;
  try {
    if(currentMedia.type === 'video') await saveVideo(currentMedia);
    else await savePhoto(currentMedia);
  } catch(err) {
    console.error("Save failed:", err);
    showToast("Could not save media. Try again.");
  } finally {
    isSaving = false;
  }
}

// ----- Save progress overlay helpers -----
let dlState = { cancel: false };
function dlShow(sub){
  const ov = document.getElementById('sv-overlay');
  if(!ov) return;
  const subEl = document.getElementById('sv-sub');
  if(subEl) subEl.textContent = sub || '';
  const fill = document.getElementById('sv-bar-fill');
  if(fill) fill.style.width = '0%';
  ov.classList.add('active');
}
function dlProg(pct, sec, totalSec){
  const fill = document.getElementById('sv-bar-fill');
  if(fill) fill.style.width = Math.max(0, Math.min(100, pct)) + '%';
  const subEl = document.getElementById('sv-sub');
  if(subEl) subEl.textContent = sec + 's of ' + Math.floor(totalSec) + 's \u2014 keep this tab open';
}
function dlHide(){
  const ov = document.getElementById('sv-overlay');
  if(ov) ov.classList.remove('active');
}
window.cancelSave = function(){ if(dlState) dlState.cancel = true; };

// Video save: re-encoded with the site mark overlaid on every frame.
// A video is never saved as a plain file; if the browser can't re-encode or
// the clip can't load, the save stops with an error.
async function saveVideo(m){
  const videoUrl = m.videoUrl;
  if(!videoUrl){ showToast("Nothing to save"); return; }
  if(typeof MediaRecorder === 'undefined' || typeof document.createElement('canvas').captureStream !== 'function'){
    showToast("Saving isn't supported on this browser");
    return;
  }
  dlState = { cancel: false };
  // Load the clip as a same-origin Blob URL so its frames can be drawn onto a
  // <canvas> (required to burn the watermark). A cross-origin <video> would taint
  // the canvas and MediaRecorder would produce nothing.
  let blobUrl = null;
  try { blobUrl = await fetchVideoObjectUrl(videoUrl); } catch(err){ console.error("Video fetch failed:", err); }
  if(!blobUrl){
    showToast("Couldn't load this video to save");
    return;
  }
  const vid = document.createElement('video');
  vid.playsInline = true;
  vid.preload = 'auto';
  vid.muted = true; // lets the clip buffer freely; sound is enabled right before playback below
  vid.src = blobUrl;
  try {
    await new Promise((res, rej) => {
      vid.onloadedmetadata = res;
      vid.onerror = () => rej(new Error('meta'));
      setTimeout(() => rej(new Error('timeout')), 20000);
    });
  } catch(err){
    console.error("Couldn't load video for saving:", err);
    if(blobUrl) URL.revokeObjectURL(blobUrl);
    showToast("Couldn't save this video");
    return;
  }
  const vw = vid.videoWidth || 720;
  const vh = vid.videoHeight || 1280;
  const canvas = document.createElement('canvas');
  canvas.width = vw;
  canvas.height = vh;
  const ctx = canvas.getContext('2d');
  let raf = null;
  const paint = async () => {
    if(dlState.cancel) return;
    if(!vid.paused && !vid.ended){
      try { ctx.drawImage(vid, 0, 0, vw, vh); } catch(e){}
      try { await drawSiteLogo(ctx, vw, vh); } catch(e){}
    }
    raf = requestAnimationFrame(paint);
  };
  const mimes = ['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm;codecs=vp9','video/webm','video/mp4'];
  const mime = mimes.find(t => MediaRecorder.isTypeSupported(t)) || '';
  const ext = mime.includes('mp4') ? 'mp4' : 'webm';
  const canvasStream = canvas.captureStream(30);
  const combined = new MediaStream(canvasStream.getVideoTracks());
  let audioCtx = null;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if(AC){
      audioCtx = new AC();
      const srcNode = audioCtx.createMediaElementSource(vid);
      const dest = audioCtx.createMediaStreamDestination();
      srcNode.connect(dest);
      await audioCtx.resume().catch(() => {});
      dest.stream.getAudioTracks().forEach(t => combined.addTrack(t));
    }
  } catch(err){ console.warn("audio capture unavailable", err); }
  const rec = new MediaRecorder(combined, { mimeType: mime, videoBitsPerSecond: 6000000 });
  const chunks = [];
  rec.ondataavailable = (e) => { if(e.data && e.data.size) chunks.push(e.data); };
  let finished = false;
  const finish = () => {
    if(finished) return;
    finished = true;
    if(raf){ cancelAnimationFrame(raf); raf = null; }
    try { if(rec.state !== 'inactive') rec.stop(); } catch(e){}
  };
  const cleanup = () => {
    if(audioCtx){ audioCtx.close().catch(() => {}); audioCtx = null; }
    if(blobUrl){ URL.revokeObjectURL(blobUrl); blobUrl = null; }
  };
  const totalSec = vid.duration || 0;
  vid.ontimeupdate = () => {
    const sec = Math.min(Math.floor(vid.currentTime || 0), Math.floor(totalSec));
    const pct = totalSec ? Math.round((vid.currentTime / totalSec) * 100) : 0;
    dlProg(pct, sec, totalSec);
    if(dlState.cancel) finish();
  };
  rec.onstop = () => {
    if(raf){ cancelAnimationFrame(raf); raf = null; }
    dlHide();
    cleanup();
    const cancelled = dlState.cancel;
    dlState = { cancel: false };
    if(cancelled){ showToast("Save cancelled"); return; }
    const blob = new Blob(chunks, { type: mime || 'video/webm' });
    if(blob.size > 0){
      downloadBlob(blob, `cashclique_${m.id}.${ext}`);
      showToast("Video saved");
    } else {
      showToast("Couldn't save this video. Try again.");
    }
  };
  vid.onended = finish;
  vid.onerror = finish;
  dlShow('Preparing\u2026');
  try {
    rec.start(300);
  } catch(err){
    console.error("Video recorder could not start:", err);
    dlHide();
    cleanup();
    dlState = { cancel: false };
    showToast("Couldn't save this video. Try again.");
    return;
  }
  paint();
  try {
    vid.muted = false; // the save tap is the user gesture that allows sound
    await vid.play();
  } catch(err){
    console.error("Video save playback needed a muted retry:", err);
    try {
      vid.muted = true;
      await vid.play();
    } catch(e2){
      finish(); // recorder is running; stopping yields an empty clip -> error toast
    }
  }
}

// Photo save: subtle site mark baked in, quietly.
async function savePhoto(m){
  const src = imageDataSrc(m.imageRaw);
  if(!src){ showToast("Nothing to save"); return; }
  const name = `cashclique_${m.id}.jpg`;
  try {
    const img = new Image();
    if(!src.startsWith('data:')) img.crossOrigin = 'anonymous';
    await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new Error('img')); img.src = src; });
    const canvas = document.createElement('canvas');
    canvas.width = img.naturalWidth || img.width;
    canvas.height = img.naturalHeight || img.height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    const logo = await loadLogo();
    if(logo && logo.width > 0){
      const gw = canvas.width * 0.32;
      const gh = gw * (logo.height / logo.width);
      ctx.save();
      ctx.globalAlpha = 0.09;
      ctx.drawImage(logo, (canvas.width - gw) / 2, (canvas.height - gh) / 2, gw, gh);
      ctx.restore();
    }
    await drawSiteLogo(ctx, canvas.width, canvas.height);
    const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.94));
    if(blob){
      downloadBlob(blob, name);
      showToast("Photo saved");
      return;
    }
    throw new Error('no-blob');
  } catch(err){
    console.error("Photo save failed, saving original instead:", err);
  }
  // Quiet fallback: save the original as-is.
  if(src.startsWith('data:')){
    downloadViaAnchor(src, name);
  } else {
    try {
      const resp = await fetch(src);
      if(resp.ok){ const blob = await resp.blob(); downloadBlob(blob, name); }
      else downloadViaAnchor(src, name);
    } catch(e2){
      downloadViaAnchor(src, name);
    }
  }
  showToast("Photo saved");
}

// Time ago helper
function timeAgo(date) {
  if (!date) return "Just now";
  const seconds = Math.floor((new Date() - date) / 1000);
  if (seconds < 60) return "Just now";
  const minutes = Math.floor(seconds / 60);
  if (minutes < 60) return `${minutes}m ago`;
  const hours = Math.floor(minutes / 60);
  if (hours < 24) return `${hours}h ago`;
  const days = Math.floor(hours / 24);
  if (days < 7) return `${days}d ago`;
  return date.toLocaleDateString();
}
